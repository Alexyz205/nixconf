keys:
  - &yubi age1yubikey1qtlwktpdhke5uqs6nv2wvwp662ygc5x52qn2w8fntvxl338j9dx2ggzk2ld
  # Software age key fallback for hosts without YubiKey access (e.g. workstation).
  # Private key: ~/.config/sops/age/keys.txt (never committed).
  - &workstation age1m7svclua6tfjzujfg06zxh2ngc4amheuex2djtahqk9f488383qqemlk9p
  # RNSW-APIGEON1 (Dell Precision 3680) host key: decrypts corp.yaml at boot
  # without a YubiKey. Private key lives on the host's /persistent volume
  # (/persistent/etc/sops-age.key); a backup copy is kept on the admin laptop.
  - &rnsw-apigeon1 age15n7vkvmkag7wvavr0yyc5j53w2fn729eu6hr8p0z0u575nd48gtqsk8q8s

creation_rules:
  - path_regex: secrets/corp\.yaml$
    age:
      - *yubi
      - *rnsw-apigeon1
  - path_regex: secrets/.+\.yaml$
    age:
      - *yubi
      - *workstation
