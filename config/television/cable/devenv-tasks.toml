[metadata]
name = "devenv-tasks"
description = "A channel to find, inspect and run devenv tasks"
requirements = ["devenv", "jq"]

[source]
command = "devenv tasks list --json 2>/dev/null | jq -er '.[].name' 2>/dev/null || devenv tasks list 2>/dev/null | sed -E 's/\\x1b\\[[0-9;]*m//g; s/^[├└│ ]*[─]*[ ]*//; /^·/d' | awk 'NF'"
display = "{0}"
output = "{0}"

[preview]
command = "jq -er --arg t '{0}' '.[] | select(.name==$t) | \"Description: \" + (.description // \"(no description)\") + \"\\n\\n\" + \"Exec:\\n\" + (.command // \"(group task, no script)\")' .devenv/gc/task-config-devenv-config-task-config 2>/dev/null || rg -n -A 8 '\\\"{0}\\\"' devenv.nix | sed 's/^/  /' | grep . || printf 'Run: devenv tasks run {0}\\n'"

[ui]
layout = "portrait"
[ui.preview_panel]
size = 50
header = "Task: {0}"

[keybindings]
enter = "actions:run"
ctrl-e = "actions:edit"
ctrl-i = "actions:info"

[actions.run]
description = "Run the selected task"
command = "devenv tasks run '{}'"
mode = "execute"

[actions.edit]
description = "Open devenv.nix"
command = "nvim \"$(git rev-parse --show-toplevel 2>/dev/null || echo .)/devenv.nix\""
mode = "fork"

[actions.info]
description = "Show task dependencies"
command = "devenv tasks run '{}' --mode all"
mode = "fork"
