[metadata]
name = "devenv-tasks"
description = "A channel to find, inspect and run devenv tasks"
requirements = ["devenv"]

[source]
command = "devenv tasks list 2>/dev/null | sed -E 's/^[├└│ ]*[─]*[ ]*//'"
display = "{0}"
output = "{0}"

[preview]
command = "jq -r --arg t '{0}' '.[] | select(.name==$t) | \"Name: \" + .name + \"\\nDescription: \" + .description + \"\\n\" + (if .command then \"Command: \" + .command else \"Command: (group task, no script)\" end) + \"\\nBefore: \" + (.before|join(\", \")) + \"\\nAfter: \" + (.after|join(\", \"))' .devenv/gc/task-config-devenv-config-task-config 2>/dev/null || rg -n -A 8 '\\\"{0}\\\"' devenv.nix | sed 's/^/  /' || printf 'Run: devenv tasks run {0}\\n'"

[ui]
layout = "portrait"
[ui.preview_panel]
size = 50
header = "Task: {0}"

[keybindings]
enter = "actions:run"
ctrl-e = "actions:edit"
ctrl-i = "actions:info"

[actions.run]
description = "Run the selected task"
command = "devenv tasks run '{}'"
mode = "execute"

[actions.edit]
description = "Open devenv.nix"
command = "nvim \"$(git rev-parse --show-toplevel 2>/dev/null || echo .)/devenv.nix\""
mode = "fork"

[actions.info]
description = "Show task dependencies"
command = "devenv tasks run '{}' --mode all"
mode = "fork"

