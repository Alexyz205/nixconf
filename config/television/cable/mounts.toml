[metadata]
name = "mounts"
description = "List mounted filesystems"
requirements = ["duf", "eza", "jq"]

[source]
command = "duf -json -only local 2>/dev/null | jq -r '.[] | [.mount_point, .fs_type, (.used/1073741824|floor|tostring + \"G\"), (.free/1073741824|floor|tostring + \"G\"), (.total/1073741824|floor|tostring + \"G\")] | @tsv'"
display = "{split:\t:0}"
output = "{split:\t:0}"

[preview]
command = "duf '{split:\t:0}' 2>/dev/null && echo && eza -la --color=always '{split:\t:0}' 2>/dev/null"

[keybindings]
enter = "actions:cd"

[actions.cd]
description = "Open a shell in the selected mount point"
command = "cd '{split:\t:0}' && $SHELL"
mode = "execute"