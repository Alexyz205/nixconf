# Nested tmux: started as `tmux -L nested -f ~/.config/tmux/nested.conf` when
# the target host is reached from inside another tmux session. The outer layer
# keeps the default C-b prefix; this one moves to C-a and hides its status bar
# so the two layers never fight over keys or stack two bars on one screen.
source-file ~/.config/tmux/tmux.conf
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g status off
